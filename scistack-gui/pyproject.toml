[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true }

[project]
name = "scistack-gui"
dynamic = ["version"]
description = "GUI for SciStack pipelines"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "scidb",
    "scihist",
    "jupyter_client>=8.0.0",
    "ipykernel>=6.0.0",
    "duckdb>=0.9.0",
]

[project.scripts]
scistack-gui = "scistack_gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["scistack_gui"]
